[project]
name = "portolan-python"
version = "1.0.0rc4"
description = "A lightweight Python implementation of the Portolan specification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Portolan contributors" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.18.0",
  "numpy<2.3 ; python_full_version >= '3.11'",
  "pytest>=8.0.0",
  "pytest-cov>=6.0.0",
  "rashid==0.4.0 ; python_full_version >= '3.11'",
  "ruff>=0.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=portolan --cov-report=term-missing --cov-fail-under=85"
markers = [
  "unit: fast isolated tests",
  "integration: tests multiple public components together",
]

[tool.coverage.run]
branch = true
source = ["portolan"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "rashid", "rashid.*"]
follow_imports = "skip"

[tool.hatch.build.targets.wheel]
packages = ["src/portolan"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
